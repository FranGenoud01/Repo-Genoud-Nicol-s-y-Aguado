name: CI Pipeline - String Calculator

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido por SonarCloud para leer la historia de commits

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Cambien a la versión que estén usando

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Si tienen un requirements.txt, descomenten la línea de abajo:
          # pip install -r requirements.txt

      # CI Server que solo compile (Verificación de sintaxis en Python)
      - name: Verificar compilación (Sintaxis)
        run: python -m compileall .

      # CI Server ejecute los Unit Tests y muestre Code Coverage
      - name: Ejecutar Tests y generar Coverage
        run: pytest --cov=. --cov-report=xml
      # CI Server ejecuta Análisis Estático de Código
      - name: Análisis en SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
